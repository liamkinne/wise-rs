[package]
name = "wise"
version = "0.1.0"
edition = "2024"

[build-dependencies]
serde_json = "1.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
progenitor = "0.14"
regress = "0.11"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
serde_json = "1.0"
serde = "1.0"
uuid = { version = "1.24", features = ["serde", "v4"] }
